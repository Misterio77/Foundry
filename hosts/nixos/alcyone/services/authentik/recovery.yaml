version: 1
metadata:
  name: Foundry - password recovery
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Example - Recovery with email verification
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Password change flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand

  - model: authentik_flows.flow
    id: recovery
    identifiers:
      slug: default-recovery-flow
    attrs:
      name: Foundry password recovery
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-recovery-identification
    attrs:
      pretend_user_exists: true
      show_matched_user: false
  - model: authentik_stages_email.emailstage
    identifiers:
      name: default-recovery-email
    attrs:
      use_global_settings: true
      token_expiry: minutes=15
      subject: Reset your Foundry password
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=15
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: Change your password
    attrs:
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]

  # Email possession resets a password; it must not create an MFA-free session.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-recovery-user-login]]
      order: 100
    state: absent
  - model: authentik_stages_redirect.redirectstage
    id: recovery-login
    identifiers:
      name: foundry-recovery-login
    attrs:
      mode: flow
      target_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      keep_context: false
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf recovery-login
      order: 100

  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      recovery_flow: !KeyOf recovery
  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      flow_recovery: !KeyOf recovery
