version: 1
metadata:
  name: Foundry - password recovery
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Password change flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - identity

  - model: authentik_flows.flow
    id: recovery
    identifiers:
      slug: default-recovery-flow
    attrs:
      name: Recuperar acesso ao Gablogin
      title: Redefinir sua senha
      designation: recovery
      authentication: require_unauthenticated
  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: default-recovery-identification
    attrs:
      user_fields:
        - email
        - username
      pretend_user_exists: true
      show_matched_user: false
  - model: authentik_stages_email.emailstage
    id: email
    identifiers:
      name: default-recovery-email
    attrs:
      use_global_settings: true
      template: email/password_reset.html
      token_expiry: minutes=15
      subject: Redefina sua senha do Gablogin
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=15
  - model: authentik_policies_expression.expressionpolicy
    id: skip-if-restored
    identifiers:
      name: default-recovery-skip-if-restored
    attrs:
      expression: |
        return not bool(request.context.get('is_restored', False))

  - model: authentik_flows.flowstagebinding
    id: identification-binding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-if-restored
      target: !KeyOf identification-binding
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      order: 40
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  # Prove enrolled MFA before even prompting for a replacement password.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 25
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      invalid_response_action: retry

  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !KeyOf recovery
  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      flow_recovery: !KeyOf recovery
