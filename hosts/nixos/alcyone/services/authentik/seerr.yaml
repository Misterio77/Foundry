version: 1
metadata:
  name: Foundry - Seerr
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_providers_oauth2.scopemapping
    id: seerr-profile
    identifiers:
      name: foundry-seerr-profile
    attrs:
      scope_name: profile
      description: Seerr profile with absolute avatar URLs
      expression: |
        avatar = request.user.avatar
        # Authentik's default image is relative; OIDC pictures must be absolute.
        picture = request.build_absolute_uri(avatar) if avatar and not avatar.startswith("data:") else None
        return delete_none_values({
            "name": request.user.name,
            "given_name": ak_obj_attr(request.user, "given_name", "name"),
            "family_name": ak_obj_attr(request.user, "family_name"),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
            "groups": [group.name for group in request.user.groups.all()],
            "picture": picture,
        })

  - model: authentik_providers_oauth2.scopemapping
    id: seerr-permissions
    identifiers:
      name: foundry-seerr-permissions
    attrs:
      scope_name: seerr_permissions
      description: Seerr permissions managed by Gablogin
      expression: |
        groups = set(request.user.groups.values_list("name", flat=True))
        defaults = ["ADMIN"] if "admins" in groups else ["REQUEST"] if "users" in groups else []
        return {"seerr_permissions": request.user.attributes.get("seerr_permissions", defaults)}

  - model: authentik_providers_oauth2.oauth2provider
    id: seerr-provider
    identifiers:
      name: Seerr
    attrs:
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, foundry-provider-authorization-email-required],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: seerr
      client_secret: !Env AUTHENTIK_SEERR_CLIENT_SECRET
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: https://requests.m7.rs/login
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://requests.m7.rs/profile/settings/linked-accounts
          redirect_uri_type: authorization
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      access_token_validity: minutes=10
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !KeyOf seerr-profile
        - !KeyOf seerr-permissions

  - model: authentik_core.application
    id: seerr
    identifiers:
      slug: seerr
    attrs:
      name: Seerr
      provider: !KeyOf seerr-provider
      meta_launch_url: https://requests.m7.rs/login?provider=authentik
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf seerr
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, users]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf seerr
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, admins]]
