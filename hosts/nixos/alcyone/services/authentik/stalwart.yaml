version: 1
metadata:
  name: Foundry - Stalwart mail and DAV
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_core.group
    identifiers:
      name: lumis-mail
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.scopemapping
    id: mail-account
    identifiers:
      name: foundry-lumis-mail-account
    attrs:
      scope_name: openid
      description: Identify the assigned lumis.cards mailbox independently of profile email
      expression: |
        account = request.user.attributes.get("lumis_mail_account", "")
        if not isinstance(account, str) or not account.endswith("@lumis.cards"):
            return {}
        return {"mail_account": account.lower()}

  - model: authentik_providers_oauth2.scopemapping
    id: mail-scope
    identifiers:
      name: foundry-lumis-mail-scope
    attrs:
      scope_name: urn:ietf:params:oauth:scope:mail
      description: Read and send Lumis mail
      expression: return {}

  - model: authentik_providers_oauth2.scopemapping
    id: calendars-scope
    identifiers:
      name: foundry-lumis-calendars-scope
    attrs:
      scope_name: urn:ietf:params:oauth:scope:calendars
      description: Read and update Lumis calendars
      expression: return {}

  - model: authentik_providers_oauth2.scopemapping
    id: contacts-scope
    identifiers:
      name: foundry-lumis-contacts-scope
    attrs:
      scope_name: urn:ietf:params:oauth:scope:contacts
      description: Read and update Lumis contacts
      expression: return {}

  - model: authentik_providers_oauth2.oauth2provider
    id: mail-resource
    identifiers:
      name: Stalwart token introspection
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: stalwart-resource
      client_secret: !Env AUTHENTIK_STALWART_CLIENT_SECRET
      grant_types:
        - client_credentials
      redirect_uris: []

  - model: authentik_providers_oauth2.oauth2provider
    id: mail-client
    identifiers:
      name: Stalwart mail and DAV
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: stalwart
      # The issuing provider grants the confidential resource introspection access.
      jwt_federation_providers:
        - !KeyOf mail-resource
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8080
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://127.0.0.1:8765/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: at.bitfire.davdroid:/oauth2/redirect
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf mail-account
        - !KeyOf mail-scope
        - !KeyOf calendars-scope
        - !KeyOf contacts-scope

  - model: authentik_core.application
    id: mail
    identifiers:
      slug: stalwart
    attrs:
      name: Lumis mail and calendars
      provider: !KeyOf mail-client
      meta_launch_url: https://mail.lumis.cards
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, lumis-mail]]
