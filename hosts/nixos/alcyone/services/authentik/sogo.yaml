version: 1
metadata:
  name: Foundry - SOGo
entries:
  # !Find requires existing dependencies without recursively replaying identity flows.
  - model: authentik_providers_oauth2.scopemapping
    id: profile
    identifiers:
      name: foundry-sogo-profile
    attrs:
      scope_name: profile
      description: SOGo display identity and authoritative avatar
      expression: |
        from authentik.core.models import Application

        apps = Application.objects.filter(slug__in=["mail", "radicale"])
        allowed = request.user.is_active and apps.count() == 2 and all(
            request.user.app_entitlements(app).filter(name="access").exists()
            for app in apps
        )
        return {"name": request.user.name, "picture": request.user.avatar, "foundry_sogo_access": allowed}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: SOGo
    attrs:
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: sogo
      client_secret: !Env AUTHENTIK_SOGO_CLIENT_SECRET
      issuer_mode: per_provider
      jwt_federation_providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Radicale]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://mail.m7.rs/api/user/v1/auth/callback/openid/m7.rs
          redirect_uri_type: authorization
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      access_token_validity: minutes=5
      refresh_token_validity: days=1
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-offline_access],
          ]
        - !KeyOf profile
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/proxy/scope-proxy],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, foundry-mail-identity],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, foundry-dav-identity],
          ]

  - model: authentik_policies_expression.expressionpolicy
    id: access
    identifiers:
      name: foundry-sogo-access
    attrs:
      expression: |
        from authentik.core.models import Application

        http = request.http_request
        if http.method in ("GET", "POST") and http.path == "/application/o/sogo/end-session/":
            return True
        apps = Application.objects.filter(slug__in=["mail", "radicale"])
        return request.user.is_active and apps.count() == 2 and all(
            request.user.app_entitlements(app).filter(name="access").exists()
            for app in apps
        )

  - model: authentik_policies_expression.expressionpolicy
    id: pkce
    identifiers:
      name: foundry-sogo-pkce-or-end-session
    attrs:
      expression: |
        from re import fullmatch

        http = request.http_request
        if http.method in ("GET", "POST") and http.path == "/application/o/sogo/end-session/":
            return True
        if http.method == "GET" and http.path in (
            "/api/v3/core/applications/",
            "/api/v3/core/applications/sogo/check_access/",
        ):
            return True
        challenge = request.context.get("oauth_code_challenge", "")
        return (
            request.context.get("oauth_grant_type") == "authorization_code"
            and request.context.get("oauth_code_challenge_method") == "S256"
            and isinstance(challenge, str)
            and fullmatch(r"[A-Za-z0-9_-]{43}", challenge) is not None
        )

  - model: authentik_core.application
    id: application
    identifiers:
      slug: sogo
    attrs:
      name: SOGo
      provider: !KeyOf provider
      meta_launch_url: https://mail.m7.rs/?autoLaunch=1
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      policy: !KeyOf access
      failure_result: false
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      order: 1
    attrs:
      policy: !KeyOf pkce
      failure_result: false
