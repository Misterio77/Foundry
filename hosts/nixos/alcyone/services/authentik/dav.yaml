version: 1
metadata:
  name: Foundry - DAV
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - identity
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - authorization

  - model: authentik_providers_oauth2.scopemapping
    id: dav-identity
    identifiers:
      name: foundry-dav-identity
    attrs:
      # Evaluated after ak_proxy, overriding any additionalHeaders attribute.
      scope_name: profile
      description: DAV authorization and storage identity
      expression: |
        from urllib.parse import quote
        from authentik.core.models import Application

        app = Application.objects.get(slug="radicale")
        principal = ""
        username = ""
        if request.user.is_active and request.user.app_entitlements(app).filter(name="access").exists():
            principal = request.user.attributes.get("dav_principal", str(request.user.uuid))
            username = quote(request.user.username, safe="")
        return {
            "ak_proxy": {
                "user_attributes": {
                    "additionalHeaders": {
                        "X-Foundry-DAV-Principal": principal,
                        "X-Foundry-DAV-Username": username,
                    },
                },
            },
        }

  - model: authentik_providers_proxy.proxyprovider
    id: dav-provider
    identifiers:
      name: Radicale
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://dav.m7.rs
      mode: forward_single
      intercept_header_auth: true
      basic_auth_enabled: false
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf dav-identity

  - model: authentik_core.application
    id: dav
    identifiers:
      slug: radicale
    attrs:
      name: Radicale
      provider: !KeyOf dav-provider
      icon: https://auth.m7.rs/branding/radicale.svg
      meta_launch_url: https://dav.m7.rs/.web/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dav
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-application-access]]
      failure_result: false

  - model: authentik_core.applicationentitlement
    id: access
    identifiers:
      app: !KeyOf dav
      name: access
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, trusted]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, admin]]

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf dav-provider
      config:
        authentik_host: https://auth.m7.rs/
