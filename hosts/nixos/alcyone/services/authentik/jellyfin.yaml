version: 1
metadata:
  name: Foundry - Jellyfin
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - identity
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - authorization

  - model: authentik_providers_oauth2.scopemapping
    id: jellyfin-roles
    identifiers:
      name: foundry-jellyfin-roles
    attrs:
      scope_name: jellyfin_roles
      description: Jellyfin application roles
      expression: |
        entitlements = set(request.user.app_entitlements(provider.application).values_list("name", flat=True))
        roles = []
        if "access" in entitlements:
            roles.append("jellyfin-users")
        if "admin" in entitlements:
            roles.append("jellyfin-admins")
        return {"roles": roles}

  - model: authentik_providers_oauth2.oauth2provider
    id: jellyfin-provider
    identifiers:
      name: Jellyfin
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: jellyfin
      client_secret: !Env AUTHENTIK_JELLYFIN_CLIENT_SECRET
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: https://media.m7.rs/sso/OIDC/Callback/authentik
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      logout_method: backchannel
      logout_uri: https://media.m7.rs/sso/OIDC/BackchannelLogout/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf jellyfin-roles

  - model: authentik_core.application
    id: jellyfin
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      provider: !KeyOf jellyfin-provider
      icon: https://auth.m7.rs/branding/jellyfin.svg
      meta_launch_url: https://media.m7.rs/sso/OIDC/Start/authentik
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf jellyfin
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-application-access]]
      failure_result: false

  - model: authentik_core.applicationentitlement
    id: access
    identifiers:
      app: !KeyOf jellyfin
      name: access
  - model: authentik_core.applicationentitlement
    id: admin
    identifiers:
      app: !KeyOf jellyfin
      name: admin
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, user]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, trusted]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
