version: 1
metadata:
  name: Foundry - private identity pilot
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - User settings flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - WebAuthn MFA setup flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes

  - model: authentik_core.group
    identifiers:
      name: users
    attrs:
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: admins
    attrs:
      is_superuser: false

  - model: authentik_policies_expression.expressionpolicy
    id: unique-email
    identifiers:
      name: foundry-unique-email
    attrs:
      expression: |
        from authentik.core.models import User

        email = request.context.get("prompt_data", {}).get("email", "").strip()
        if not email:
            return True
        users = User.objects.filter(email__iexact=email)
        if request.user.pk:
            users = users.exclude(pk=request.user.pk)
        if users.exists():
            ak_message("Este e-mail já está em uso por outra conta.")
            return False
        return True

  - model: authentik_stages_prompt.prompt
    identifiers:
      name: default-user-settings-field-email
    attrs:
      required: false
  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: default-user-settings
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-user-settings-field-username]]
        - !Find [authentik_stages_prompt.prompt, [name, default-user-settings-field-name]]
        - !Find [authentik_stages_prompt.prompt, [name, default-user-settings-field-email]]
        - !Find [authentik_stages_prompt.prompt, [name, default-user-settings-field-locale]]
      validation_policies:
        - !Find [authentik_policies_expression.expressionpolicy, [name, default-user-settings-authorization]]
        - !KeyOf unique-email

  # Only apps that require email use this authorization flow.
  - model: authentik_flows.flow
    id: email-required-authorization
    identifiers:
      slug: foundry-provider-authorization-email-required
    attrs:
      designation: authorization
      name: Acessar aplicativo com e-mail
      title: Acessar aplicativo
      authentication: require_authenticated
  - model: authentik_policies_expression.expressionpolicy
    id: missing-email
    identifiers:
      name: foundry-missing-email
    attrs:
      expression: |
        return not bool((request.user.email or "").strip())
  - model: authentik_stages_prompt.prompt
    id: required-email-introduction
    identifiers:
      name: foundry-required-email-introduction
    attrs:
      field_key: email-introduction
      label: Instruções
      type: static
      required: false
      initial_value: Adicione seu e-mail para continuar.
      order: -1
  - model: authentik_stages_prompt.prompt
    id: required-email-field
    identifiers:
      name: foundry-required-email
    attrs:
      field_key: email
      label: E-mail
      type: email
      required: true
      placeholder: voce@exemplo.com
      order: 0
  - model: authentik_stages_prompt.promptstage
    id: required-email-prompt
    identifiers:
      name: foundry-required-email-prompt
    attrs:
      fields:
        - !KeyOf required-email-introduction
        - !KeyOf required-email-field
      validation_policies:
        - !KeyOf unique-email
  - model: authentik_stages_user_write.userwritestage
    id: required-email-write
    identifiers:
      name: foundry-required-email-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_flows.flowstagebinding
    id: required-email-prompt-binding
    identifiers:
      target: !KeyOf email-required-authorization
      stage: !KeyOf required-email-prompt
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf missing-email
      target: !KeyOf required-email-prompt-binding
      order: 0
  - model: authentik_flows.flowstagebinding
    id: required-email-write-binding
    identifiers:
      target: !KeyOf email-required-authorization
      stage: !KeyOf required-email-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf missing-email
      target: !KeyOf required-email-write-binding
      order: 0

  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-authentication-login
    attrs:
      session_duration: days=30

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - webauthn
        - totp
      not_configured_action: skip
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
      last_auth_threshold: seconds=0
      webauthn_user_verification: required

  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      name: Entrar no Gablogin
      title: Entrar no Gablogin
  - model: authentik_flows.flow
    identifiers:
      slug: default-invalidation-flow
    attrs:
      name: Sair do Gablogin
      title: Sair do Gablogin
  - model: authentik_flows.flow
    identifiers:
      slug: default-user-settings-flow
    attrs:
      name: Minha conta
      title: Atualizar seus dados
  - model: authentik_flows.flow
    identifiers:
      slug: default-password-change
    attrs:
      name: Alterar senha
      title: Alterar sua senha
  - model: authentik_flows.flow
    identifiers:
      slug: default-authenticator-totp-setup
    attrs:
      name: Configurar aplicativo autenticador
      title: Configurar aplicativo autenticador
  - model: authentik_flows.flow
    identifiers:
      slug: default-authenticator-webauthn-setup
    attrs:
      name: Configurar chave de acesso
      title: Configurar chave de acesso
  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-implicit-consent
    attrs:
      name: Acessar aplicativo
      title: Redirecionando para o aplicativo
  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-invalidation-flow
    attrs:
      name: Sair do aplicativo
      title: Você saiu do aplicativo
  - model: authentik_flows.flow
    identifiers:
      slug: default-request
    attrs:
      name: Solicitar acesso
      title: Solicitar acesso
  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      branding_title: Gablogin
      branding_logo: https://auth.m7.rs/branding/logo-%(theme)s.svg
      branding_favicon: https://auth.m7.rs/branding/favicon.svg
      branding_default_flow_background: https://auth.m7.rs/branding/background.svg
      attributes:
        settings:
          locale: pt-BR
