version: 1
metadata:
  name: Foundry - Calibre-Web LDAP
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow

  - model: authentik_core.group
    id: book-users
    identifiers:
      name: book-users
    attrs:
      is_superuser: false
  - model: authentik_core.user
    id: calibre-web-search
    identifiers:
      username: calibre-web-search
    attrs:
      name: Calibre-Web LDAP search
      type: service_account
      is_active: true

  - model: authentik_flows.flow
    id: ldap-bind
    identifiers:
      slug: calibre-web-ldap-bind
    attrs:
      name: Calibre-Web LDAP bind
      title: Calibre-Web LDAP bind
      designation: authentication
      authentication: require_outpost
  - model: authentik_stages_identification.identificationstage
    id: ldap-identification
    identifiers:
      name: calibre-web-ldap-identification
    attrs:
      user_fields:
        - username
  - model: authentik_stages_password.passwordstage
    id: ldap-password
    identifiers:
      name: calibre-web-ldap-password
    attrs:
      backends:
        - authentik.core.auth.TokenBackend
  - model: authentik_stages_user_login.userloginstage
    id: ldap-login
    identifiers:
      name: calibre-web-ldap-login
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ldap-bind
      stage: !KeyOf ldap-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ldap-bind
      stage: !KeyOf ldap-password
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ldap-bind
      stage: !KeyOf ldap-login
      order: 100

  - model: authentik_providers_ldap.ldapprovider
    id: calibre-web-provider
    identifiers:
      name: Calibre-Web
    attrs:
      authorization_flow: !KeyOf ldap-bind
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      base_dn: ou=calibre-web,dc=ldap,dc=m7,dc=rs
      bind_mode: direct
      search_mode: direct
      mfa_support: false
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf calibre-web-search
  - model: authentik_core.application
    id: calibre-web
    identifiers:
      slug: calibre-web
    attrs:
      name: Calibre-Web
      provider: !KeyOf calibre-web-provider
      meta_launch_url: https://books.m7.rs
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-web
      group: !KeyOf book-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-web
      user: !KeyOf calibre-web-search
      order: 1
