version: 1
metadata:
  name: Foundry - Calibre-Web
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: calibre-web-identity
    identifiers:
      name: foundry-calibre-web-identity
    attrs:
      scope_name: profile
      description: Immutable Calibre-Web account identity
      expression: |
        from urllib.parse import quote

        return {
            "ak_proxy": {
                "user_attributes": {
                    "additionalHeaders": {
                        "X-Foundry-Calibre-Web-Subject": str(request.user.uuid) if request.user.is_active else "",
                        "X-Foundry-Calibre-Web-Username": quote(request.user.username, safe="") if request.user.is_active else "",
                        "X-Foundry-Calibre-Web-Email": quote(request.user.email, safe="") if request.user.is_active else "",
                    },
                },
            },
        }

  - model: authentik_providers_proxy.proxyprovider
    id: calibre-web-provider
    identifiers:
      name: Calibre-Web
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://books.m7.rs
      mode: forward_single
      intercept_header_auth: false
      basic_auth_enabled: false
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf calibre-web-identity

  - model: authentik_core.application
    id: calibre-web
    identifiers:
      slug: calibre-web
    attrs:
      name: Calibre
      provider: !KeyOf calibre-web-provider
      icon: https://auth.m7.rs/branding/calibre.svg
      meta_launch_url: https://books.m7.rs/
      policy_engine_mode: all

  - model: authentik_policies_expression.expressionpolicy
    id: calibre-web-access
    identifiers:
      name: foundry-calibre-web-access
    attrs:
      expression: return request.user.is_authenticated and request.user.is_active
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-web
      order: 0
    attrs:
      policy: !KeyOf calibre-web-access
      failure_result: false
