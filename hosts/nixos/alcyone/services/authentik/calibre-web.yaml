version: 1
metadata:
  name: Foundry - Calibre-Web
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: books-identity
    identifiers:
      name: foundry-books-identity
    attrs:
      scope_name: profile
      description: Immutable Calibre-Web account identity
      expression: |
        return {
            "ak_proxy": {
                "user_attributes": {
                    "additionalHeaders": {
                        "X-Foundry-Books-Subject": str(request.user.uuid) if request.user.is_active else "",
                    },
                },
            },
        }

  - model: authentik_providers_proxy.proxyprovider
    id: books-provider
    identifiers:
      name: Calibre-Web
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://books.m7.rs
      mode: forward_single
      intercept_header_auth: false
      basic_auth_enabled: false
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf books-identity

  - model: authentik_core.application
    id: books
    identifiers:
      slug: calibre-web
    attrs:
      name: Calibre
      provider: !KeyOf books-provider
      icon: https://auth.m7.rs/branding/calibre.svg
      meta_launch_url: https://books.m7.rs/
      policy_engine_mode: all

  - model: authentik_policies_expression.expressionpolicy
    id: books-access
    identifiers:
      name: foundry-books-access
    attrs:
      expression: return request.user.is_authenticated and request.user.is_active
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf books
      order: 0
    attrs:
      policy: !KeyOf books-access
      failure_result: false
