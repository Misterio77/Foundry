version: 1
metadata:
  name: Foundry - password guessing protection
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - sensitive account changes

  - model: authentik_policies_reputation.reputationpolicy
    id: username-reputation
    identifiers:
      name: foundry-password-username-reputation
    attrs:
      check_ip: false
      check_username: true
      threshold: -5
  - model: authentik_policies_reputation.reputationpolicy
    id: ip-reputation
    identifiers:
      name: foundry-password-ip-reputation
    attrs:
      check_ip: true
      check_username: false
      threshold: -20
  - model: authentik_stages_deny.denystage
    id: deny
    identifiers:
      name: foundry-password-guessing-deny

  # Reputation policies pass for bad scores: run a Deny stage, never skip Password.
  # Evaluate after identification, with fresh scores rather than a cached plan result.
  - model: authentik_flows.flowstagebinding
    id: authentication-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf deny
      order: 15
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf authentication-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf authentication-deny
      policy: !KeyOf ip-reputation
      order: 1
    attrs:
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: password-change-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-password-change]]
      stage: !KeyOf deny
      order: -30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf password-change-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf password-change-deny
      policy: !KeyOf ip-reputation
      order: 1
    attrs:
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: settings-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      stage: !KeyOf deny
      order: -30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf settings-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf settings-deny
      policy: !KeyOf ip-reputation
      order: 1
    attrs:
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: totp-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authenticator-totp-setup]]
      stage: !KeyOf deny
      order: -30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf totp-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf totp-deny
      policy: !KeyOf ip-reputation
      order: 1
    attrs:
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: webauthn-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
      stage: !KeyOf deny
      order: -30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf webauthn-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf webauthn-deny
      policy: !KeyOf ip-reputation
      order: 1
    attrs:
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: email-username-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, foundry-provider-authorization-email-required]]
      stage: !KeyOf deny
      order: -31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-username-deny
      policy: !KeyOf username-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-username-deny
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-missing-email]]
      order: 1

  # Existing-email authorizations don't ask for credentials and must stay unaffected.
  - model: authentik_flows.flowstagebinding
    id: email-ip-deny
    identifiers:
      target: !Find [authentik_flows.flow, [slug, foundry-provider-authorization-email-required]]
      stage: !KeyOf deny
      order: -30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-ip-deny
      policy: !KeyOf ip-reputation
      order: 0
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-ip-deny
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-missing-email]]
      order: 1
