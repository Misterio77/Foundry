version: 1
metadata:
  name: Foundry - Merope LDAP
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - Calibre-Web LDAP

  - model: authentik_outposts.outpost
    identifiers:
      name: Merope LDAP
    attrs:
      type: ldap
      service_connection: null
      config:
        authentik_host: https://auth.m7.rs
        authentik_host_insecure: false
      providers:
        - !Find [authentik_providers_ldap.ldapprovider, [name, Calibre-Web]]
