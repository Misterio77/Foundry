version: 1
metadata:
  name: Foundry - Immich
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_core.group
    id: immich-users
    identifiers:
      name: immich-users
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: Immich
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: immich
      client_secret: !Env AUTHENTIK_IMMICH_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://photos.m7.rs/auth/login
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://photos.m7.rs/user-settings
          redirect_uri_type: authorization
        - matching_mode: strict
          url: app.immich:///oauth-callback
          redirect_uri_type: authorization
      logout_uri: https://photos.m7.rs/api/oauth/backchannel-logout
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      refresh_token_validity: days=7
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: immich
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      meta_launch_url: https://photos.m7.rs/auth/login?autoLaunch=1
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich
      group: !KeyOf immich-users
      order: 0
