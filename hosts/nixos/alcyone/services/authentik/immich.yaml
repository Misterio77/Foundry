version: 1
metadata:
  name: Foundry - Immich
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - authorization

  - model: authentik_providers_oauth2.scopemapping
    id: immich-roles
    identifiers:
      name: foundry-immich-roles
    attrs:
      scope_name: immich_roles
      description: Immich application role
      expression: |
        entitlements = set(request.user.app_entitlements(provider.application).values_list("name", flat=True))
        if "admin" in entitlements:
            return {"immich_role": "admin"}
        if "access" in entitlements:
            return {"immich_role": "user"}
        return {}

  - model: authentik_providers_oauth2.scopemapping
    id: immich-quota
    identifiers:
      name: foundry-immich-quota
    attrs:
      scope_name: immich_quota
      description: Immich storage quota in GiB (defaults to 8; -1 for unlimited)
      expression: |
        return {"immich_quota": int(request.user.attributes.get("immich_quota", 8))}

  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: Immich
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, foundry-provider-authorization-email-required]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: immich
      client_secret: !Env AUTHENTIK_IMMICH_CLIENT_SECRET
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: https://photos.m7.rs/auth/login
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://photos.m7.rs/user-settings
          redirect_uri_type: authorization
        - matching_mode: strict
          url: app.immich:///oauth-callback
          redirect_uri_type: authorization
      logout_uri: https://photos.m7.rs/api/oauth/backchannel-logout
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf immich-roles
        - !KeyOf immich-quota

  - model: authentik_core.application
    id: immich
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      icon: https://auth.m7.rs/branding/immich.svg
      meta_launch_url: https://photos.m7.rs/auth/login?autoLaunch=1
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-application-access]]
      failure_result: false

  - model: authentik_core.applicationentitlement
    id: access
    identifiers:
      app: !KeyOf immich
      name: access
  - model: authentik_core.applicationentitlement
    id: admin
    identifiers:
      app: !KeyOf immich
      name: admin
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, user]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, trusted]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
