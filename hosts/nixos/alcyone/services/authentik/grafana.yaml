version: 1
metadata:
  name: Foundry - Grafana
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_providers_oauth2.scopemapping
    id: grafana-roles
    identifiers:
      name: foundry-grafana-roles
    attrs:
      scope_name: grafana_roles
      description: Grafana organization role
      expression: |
        groups = set(request.user.groups.values_list("name", flat=True))
        if "admins" in groups:
            return {"grafana_role": "Admin"}
        if "users" in groups:
            return {"grafana_role": "Viewer"}
        return {"grafana_role": ""}

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, foundry-provider-authorization-email-required]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://dash.m7.rs/login/generic_oauth
          redirect_uri_type: authorization
      logout_uri: https://dash.m7.rs/logout
      logout_method: frontchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=1
      refresh_token_validity: days=7
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf grafana-roles

  - model: authentik_core.application
    id: grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://dash.m7.rs/login
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, users]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, admins]]
