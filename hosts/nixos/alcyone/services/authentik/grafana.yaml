version: 1
metadata:
  name: Foundry - Grafana
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_core.group
    id: grafana-users
    identifiers:
      name: grafana-users
    attrs:
      is_superuser: false
  - model: authentik_core.group
    id: grafana-admins
    identifiers:
      name: grafana-admins
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://dash.m7.rs/login/generic_oauth
          redirect_uri_type: authorization
      logout_uri: https://dash.m7.rs/logout
      logout_method: frontchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
      refresh_token_validity: days=7
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    id: grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://dash.m7.rs
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      group: !KeyOf grafana-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      group: !KeyOf grafana-admins
      order: 1
