version: 1
metadata:
  name: Foundry - Grafana
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - identity
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - authorization

  - model: authentik_providers_oauth2.scopemapping
    id: grafana-roles
    identifiers:
      name: foundry-grafana-roles
    attrs:
      scope_name: grafana_roles
      description: Grafana application role
      expression: |
        entitlements = set(request.user.app_entitlements(provider.application).values_list("name", flat=True))
        if "admin" in entitlements:
            return {"grafana_role": "GrafanaAdmin"}
        if "access" in entitlements:
            return {"grafana_role": "Viewer"}
        return {"grafana_role": ""}

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, foundry-provider-authorization-email-required]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://dash.m7.rs/login/generic_oauth
          redirect_uri_type: authorization
      logout_uri: https://dash.m7.rs/login/generic_oauth/backchannel-logout
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=1
      refresh_token_validity: days=7
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf grafana-roles

  - model: authentik_core.application
    id: grafana
    identifiers:
      slug: grafana
    attrs:
      name: Monitoramento (Grafana)
      provider: !KeyOf grafana-provider
      icon: https://auth.m7.rs/branding/grafana.svg
      meta_launch_url: https://dash.m7.rs/login
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-application-access]]
      failure_result: false

  - model: authentik_core.applicationentitlement
    id: access
    identifiers:
      app: !KeyOf grafana
      name: access
  - model: authentik_core.applicationentitlement
    id: admin
    identifiers:
      app: !KeyOf grafana
      name: admin
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, user]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, trusted]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
