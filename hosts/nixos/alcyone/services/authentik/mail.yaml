version: 1
metadata:
  name: Foundry - personal mail and DAV
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_core.group
    identifiers:
      name: personal-mail
    attrs:
      is_superuser: false
      attributes:
        goauthentik.io/user/token-maximum-lifetime: days=365

  - model: authentik_core.group
    identifiers:
      name: dav-users
    attrs:
      is_superuser: false
      attributes:
        goauthentik.io/user/token-maximum-lifetime: days=365

  - model: authentik_providers_oauth2.scopemapping
    id: mail-access
    identifiers:
      name: foundry-personal-mail-access
    attrs:
      scope_name: urn:ietf:params:oauth:scope:mail
      description: Read and send personal mail
      expression: |
        if not request.user.is_active or not ak_is_group_member(request.user, name="personal-mail"):
            return {}
        return {
            "mail_account": "hi@m7.rs",
            "mail_username": request.user.username,
            "mail_access": "allowed",
        }

  - model: authentik_providers_oauth2.scopemapping
    id: dav-identity
    identifiers:
      name: foundry-dav-identity
    attrs:
      # Evaluated after ak_proxy, overriding any additionalHeaders attribute.
      scope_name: profile
      description: DAV authorization and storage identity
      expression: |
        principal = ""
        if request.user.is_active and ak_is_group_member(request.user, name="dav-users"):
            principal = request.user.attributes.get("dav_principal", str(request.user.uuid))
        return {
            "ak_proxy": {
                "user_attributes": {
                    "additionalHeaders": {"X-Foundry-DAV-Principal": principal},
                },
            },
        }

  - model: authentik_providers_proxy.proxyprovider
    id: dav-provider
    identifiers:
      name: Radicale
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://dav.m7.rs
      mode: forward_single
      intercept_header_auth: true
      basic_auth_enabled: false
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf dav-identity

  - model: authentik_providers_oauth2.oauth2provider
    id: mail-client
    identifiers:
      name: Mail and DAV
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: mail-and-dav
      issuer_mode: per_provider
      jwt_federation_providers:
        - !KeyOf dav-provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:8765/callback
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !KeyOf mail-access
        - !KeyOf dav-identity

  # Keep noninteractive app-password grants separate from the PKCE-only client.
  - model: authentik_providers_oauth2.oauth2provider
    id: mail-app-passwords-provider
    identifiers:
      name: Mail app passwords
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: mail-app-passwords
      issuer_mode: per_provider
      grant_types:
        - password
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=5
      property_mappings:
        - !KeyOf mail-access

  - model: authentik_core.application
    id: mail-app-passwords
    identifiers:
      slug: mail-app-passwords
    attrs:
      name: Mail app passwords
      provider: !KeyOf mail-app-passwords-provider
      meta_launch_url: blank://blank
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail-app-passwords
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, personal-mail]]
      failure_result: false

  - model: authentik_policies_expression.expressionpolicy
    id: mail-membership
    identifiers:
      name: foundry-mail-and-dav-membership
    attrs:
      expression: |
        return (
            ak_is_group_member(request.user, name="personal-mail")
            or ak_is_group_member(request.user, name="dav-users")
        )

  - model: authentik_policies_expression.expressionpolicy
    id: mail-pkce
    identifiers:
      name: foundry-mail-and-dav-pkce
    attrs:
      expression: |
        from re import fullmatch

        challenge = request.context.get("oauth_code_challenge", "")
        return (
            request.context.get("oauth_grant_type") == "authorization_code"
            and request.context.get("oauth_code_challenge_method") == "S256"
            and isinstance(challenge, str)
            and fullmatch(r"[A-Za-z0-9_-]{43}", challenge) is not None
        )

  - model: authentik_core.application
    id: mail
    identifiers:
      slug: mail-and-dav
    attrs:
      name: Mail and DAV
      provider: !KeyOf mail-client
      meta_launch_url: blank://blank
      policy_engine_mode: all

  # Replace the old OR group bindings in place; membership must not bypass PKCE.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail
      order: 0
    attrs:
      group: null
      policy: !KeyOf mail-membership
      failure_result: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail
      order: 1
    attrs:
      group: null
      policy: !KeyOf mail-pkce
      failure_result: false

  - model: authentik_core.application
    id: dav
    identifiers:
      slug: radicale
    attrs:
      name: Radicale
      provider: !KeyOf dav-provider
      icon: ""
      meta_launch_url: blank://blank
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dav
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, dav-users]]

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf dav-provider
      config:
        authentik_host: https://auth.m7.rs/
