version: 1
metadata:
  name: Foundry - Mail
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - identity
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - authorization

  - model: authentik_providers_oauth2.scopemapping
    id: mail-identity
    identifiers:
      name: foundry-mail-identity
    attrs:
      scope_name: urn:ietf:params:oauth:scope:mail
      description: Read and send mail
      expression: |
        from authentik.core.models import Application

        app = Application.objects.get(slug="mail")
        if not request.user.is_active or not request.user.app_entitlements(app).filter(name="access").exists():
            return {}
        principal = request.user.attributes.get("mail_principal")
        if not isinstance(principal, str) or not principal.strip():
            return {}
        return {
            "mail_account": principal,
            "mail_username": request.user.username,
        }

  # Password grants stay separate from the shared PKCE-only client.
  - model: authentik_providers_oauth2.oauth2provider
    id: mail-provider
    identifiers:
      name: Mail app passwords
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: mail-app-passwords
      issuer_mode: per_provider
      grant_types:
        - password
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf mail-identity

  - model: authentik_core.application
    id: mail
    identifiers:
      slug: mail
    attrs:
      name: Mail
      provider: !KeyOf mail-provider
      meta_launch_url: blank://blank
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, foundry-application-access]]
      failure_result: false

  - model: authentik_core.applicationentitlement
    id: access
    identifiers:
      app: !KeyOf mail
      name: access
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, trusted]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf access
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
