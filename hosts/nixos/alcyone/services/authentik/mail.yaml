version: 1
metadata:
  name: Foundry - personal mail and DAV
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Foundry - private identity pilot

  - model: authentik_core.group
    identifiers:
      name: personal-mail
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.scopemapping
    id: mail-access
    identifiers:
      name: foundry-personal-mail-access
    attrs:
      scope_name: urn:ietf:params:oauth:scope:mail
      description: Read and send personal mail
      expression: |
        if not request.user.is_active or not ak_is_group_member(request.user, name="personal-mail"):
            return {}
        return {"mail_account": "hi@m7.rs", "mail_access": "allowed"}

  - model: authentik_providers_oauth2.oauth2provider
    id: mail-client
    identifiers:
      name: Personal mail
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: personal-mail
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:8765/callback
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf mail-access

  - model: authentik_core.application
    id: mail
    identifiers:
      slug: personal-mail
    attrs:
      name: Personal mail
      provider: !KeyOf mail-client
      meta_launch_url: blank://blank
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mail
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, personal-mail]]

  - model: authentik_providers_proxy.proxyprovider
    id: dav-provider
    identifiers:
      name: Personal calendars and contacts
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://dav.m7.rs
      mode: forward_single
      intercept_header_auth: true
      basic_auth_enabled: false

  - model: authentik_core.application
    id: dav
    identifiers:
      slug: personal-dav
    attrs:
      name: Personal calendars and contacts
      provider: !KeyOf dav-provider
      meta_launch_url: blank://blank
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dav
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, personal-mail]]

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf dav-provider
      config:
        authentik_host: https://auth.m7.rs/
