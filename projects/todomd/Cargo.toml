[package]
name = "todomd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Edit vdir-backed VTODO lists as Markdown"
license = "BSD-2-Clause"
repository = "https://github.com/misterio77/Foundry"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
icalendar = "0.17.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
shlex = "1.3"
tempfile = "3.20"
toml = "0.9"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
nix = { version = "0.30", features = ["fs", "process", "signal", "term"] }
