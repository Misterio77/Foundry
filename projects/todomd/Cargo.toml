[package]
name = "todomd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Edit vdir-backed VTODO lists as Markdown"
license = "BSD-2-Clause"
repository = "https://github.com/misterio77/Foundry"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.2"
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
fs2 = "0.4"
icalendar = "0.17.13"
iana-time-zone = "0.1"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
shlex = "1.3"
tempfile = "3.20"
tokio = { version = "1.47", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tower-lsp = "0.20"
uuid = { version = "1.0", features = ["v4"] }
